workflows:
  ios-production:
    name: Grassland Cheese iOS Production Build
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - grassland_cheese_ios
      xcode: 16.2
      node: 18.17.0
    ios_signing:
      distribution_type: app_store
      bundle_identifier: com.grasslandcheese.app
    scripts:
      - name: Install dependencies using npm workspaces
        script: |
          cd $CM_BUILD_DIR
          npm ci --workspaces
      - name: Install Expo CLI globally
        script: |
          npm install -g @expo/cli
      - name: Prebuild Expo app for iOS native development
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx expo prebuild --platform ios --clean --no-install
      - name: Install native iOS dependencies via CocoaPods
        script: |
          cd $CM_BUILD_DIR/apps/mobile/ios
          pod install
      - name: Update build version from CI build number
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          BUILD_NUMBER=$CI_BUILD_NUMBER
          xcrun agvtool new-version -all "$BUILD_NUMBER"
      - name: Set up iOS code signing with Codemagic
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          xcode-project use-profiles
      - name: Build iOS app as .ipa for App Store
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          xcode-project build-ipa \
            --workspace ios/dairy_sales.xcworkspace \
            --scheme dairy_sales \
            --configuration Release
    artifacts:
      - $CM_BUILD_DIR/apps/mobile/build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
      email:
        recipients:
          - $DEVELOPER_EMAIL
        notify:
          success: true
          failure: true

  ios-development:
    name: Grassland Cheese iOS Development Build
    instance_type: mac_mini_m2
    max_build_duration: 90
    environment:
      groups:
        - grassland_cheese_ios
      xcode: 16.2
      node: 18.17.0
    ios_signing:
      distribution_type: ad_hoc
      bundle_identifier: com.grasslandcheese.app
    scripts:
      - name: Install dependencies using npm workspaces
        script: |
          cd $CM_BUILD_DIR
          npm ci --workspaces
      - name: Install Expo CLI globally
        script: |
          npm install -g @expo/cli
      - name: Prebuild Expo app for iOS native development
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          npx expo prebuild --platform ios --clean --no-install
      - name: Install native iOS dependencies via CocoaPods
        script: |
          cd $CM_BUILD_DIR/apps/mobile/ios
          pod install
      - name: Set up iOS code signing with Codemagic
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          xcode-project use-profiles
      - name: Build iOS app as .ipa for Ad Hoc distribution
        script: |
          cd $CM_BUILD_DIR/apps/mobile
          xcode-project build-ipa \
            --workspace ios/dairy_sales.xcworkspace \
            --scheme dairy_sales \
            --configuration Debug
    artifacts:
      - $CM_BUILD_DIR/apps/mobile/build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - $DEVELOPER_EMAIL
        notify:
          success: true
          failure: true
